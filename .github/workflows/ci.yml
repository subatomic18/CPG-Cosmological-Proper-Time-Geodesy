name: Core validation

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out CPG
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run regression suite
        run: python -m pytest -q

      - name: Compile research modules
        shell: bash
        run: python -m py_compile cpg_*.py
