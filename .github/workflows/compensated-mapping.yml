name: Compensated redshift mapping closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compensated-mapping.yml'
      - 'cpg_compensated_mapping.py'
      - 'test_cpg_compensated_mapping.py'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out CPG
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest

      - name: Run unit tests
        run: pytest -q test_cpg_compensated_mapping.py

      - name: Run compensated closure scan
        run: |
          python cpg_compensated_mapping.py \
            --h0-late 73.04342157543183 \
            --h0-early 67.26899612716719 \
            --max-hubble-error 0.01 \
            --z-star 1089.938 | tee compensated_mapping.txt
          python cpg_compensated_mapping.py \
            --h0-late 73.04342157543183 \
            --h0-early 67.26899612716719 \
            --max-hubble-error 0.01 \
            --z-star 1089.938 \
            --json > compensated_mapping.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: compensated-redshift-mapping
          path: |
            compensated_mapping.txt
            compensated_mapping.json
